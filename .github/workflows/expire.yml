name: Expire temporary practice site
on:
  schedule:
    - cron: '0 15 5 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the expiry without unpublishing'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  pages: write
jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the approved repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify or unpublish only this Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/expire_pages.py
